<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Командный дашборд процессов — канбан</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --fg:#e2e8f0; --muted:#94a3b8;
    --line:#334155; --green:#34d399; --yellow:#fbbf24; --blue:#60a5fa; --gray:#64748b; --red:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
  .wrap{max-width:1400px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  h1{font-size:22px;font-weight:700}
  .updated{color:var(--muted);font-size:12px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:8px}
  .stat b{font-size:18px}
  .stat span{color:var(--muted);font-size:12px}

  /* ===== КАНБАН ===== */
  .kanban-scroll{overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .kanban{display:grid;grid-template-columns:repeat(3,minmax(320px,1fr));gap:16px;align-items:start;min-width:1020px}
  .col{background:rgba(30,41,59,.55);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 14px;font-weight:700;font-size:15px}
  .col-head .count{background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
  .col.active{border-top:3px solid var(--green)}
  .col.pending{border-top:3px solid var(--yellow)}
  .col.completed{border-top:3px solid var(--blue)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
  .card:hover{border-color:var(--blue);transform:translateY(-1px)}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .card .name{font-weight:650;font-size:14px}
  .card .hint{color:var(--blue);font-size:11px;text-align:right;margin-top:8px}
  .badge{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .badge.active{background:rgba(52,211,153,.15);color:var(--green)}
  .badge.pending{background:rgba(251,191,36,.15);color:var(--yellow)}
  .badge.completed{background:rgba(96,165,250,.15);color:var(--blue)}
  .type-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-top:8px}
  .type-tag.group{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.3)}
  .type-tag.individual{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.3)}
  .card .desc{color:#cbd5e1;font-size:12.5px;margin-bottom:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
  .card .row{color:var(--muted);font-size:12px}
  .card .row b{color:var(--fg);font-weight:600}

  /* ===== МОДАЛЬНОЕ ОКНО ===== */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.75);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:22px 24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal .m-close{position:absolute;top:14px;right:16px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modal .m-close:hover{border-color:var(--red);color:var(--red)}
  .modal .m-icon{font-size:34px;margin-bottom:6px}
  .modal .m-title{font-size:20px;font-weight:700;margin-bottom:6px;padding-right:40px}
  .modal .m-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 12px;border-radius:999px;margin-bottom:14px}
  .modal .m-block{margin-bottom:14px}
  .modal .m-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .modal .m-text{font-size:14px;color:var(--fg);line-height:1.55}
  .modal .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:600px){.modal .m-grid{grid-template-columns:1fr}}
  .modal .m-grid .cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .modal .m-notes{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.25);border-radius:10px;padding:10px 12px}
  footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗂 Командный дашборд процессов — канбан</h1>
    <div class="updated" id="updated">загрузка…</div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="kanban-scroll"><div class="kanban" id="kanban"></div></div>

  <footer>Автообновление данных: ежедневно 07:15 · GitHub Pages · генерируется продюсером команды</footer>
</div>

<!-- Модальное окно -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="m-close" onclick="closeModal()" title="Закрыть">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const STATUSES = [
  {key:'pending',   label:'Ожидают',   color:'var(--yellow)', badge:'pending'},
  {key:'active',    label:'В работе',  color:'var(--green)',  badge:'active'},
  {key:'completed', label:'Завершены', color:'var(--blue)',   badge:'completed'},
];
let DATA = {processes:[]};

async function load(){
  try{
    const r = await fetch('data/processes.json', {cache:'no-store'});
    DATA = await r.json();
  }catch(e){
    document.getElementById('kanban').innerHTML = '<p style="color:var(--red)">Не удалось загрузить данные.</p>';
    return;
  }
  render();
}
function render(){
  document.getElementById('updated').textContent = 'Обновлено: ' + (DATA.generated_at || '—');
  const counts = {active:0, pending:0, completed:0};
  DATA.processes.forEach(p => counts[p.status] = (counts[p.status]||0)+1);
  document.getElementById('stats').innerHTML = STATUSES.map(s =>
    `<div class="stat"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span><b style="color:${s.color}">${counts[s.key]||0}</b><span>${s.label}</span></div>`
  ).join('') + `<div class="stat"><b>${DATA.processes.length}</b><span>Всего</span></div>`;

  document.getElementById('kanban').innerHTML = STATUSES.map(s => `
    <div class="col ${s.key}">
      <div class="col-head"><span style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.label}</span><span class="count">${counts[s.key]||0}</span></div>
      ${DATA.processes.filter(p=>p.status===s.key).map(cardHtml).join('') || '<p style="color:var(--muted);font-size:12px;padding:8px">Пусто</p>'}
    </div>
  `).join('');
}
function cardHtml(p){
  const b = STATUSES.find(s=>s.key===p.status);
  const t = p.type==='group'
    ? '<span class="type-tag group">👥 Командный</span>'
    : '<span class="type-tag individual">🧑‍💻 Индивидуальный</span>';
  return `<div class="card" onclick="openModal('${p.id}')" title="Открыть описание">
    <div class="top"><span class="name">${p.icon||'•'} ${p.name}</span><span class="badge ${b.badge}">${b.label}</span></div>
    ${p.desc ? `<div class="desc">${p.desc}</div>` : ''}
    ${t}
    <div class="meta">
      <div class="row">🕐 <b>Расписание:</b> ${p.schedule}</div>
      <div class="row">✅ <b>Последний запуск:</b> ${p.last}</div>
    </div>
    <div class="hint">Подробнее →</div>
  </div>`;
}
function openModal(id){
  const p = DATA.processes.find(x=>x.id===id);
  if(!p) return;
  const b = STATUSES.find(s=>s.key===p.status);
  document.getElementById('modalBody').innerHTML = `
    <div class="m-icon">${p.icon||'•'}</div>
    <div class="m-title">${p.name}</div>
    <span class="m-badge ${b.badge}" style="background:${b.color}22;color:${b.color}">${b.label}</span>
    ${p.type==='group'
      ? '<span class="m-badge" style="background:rgba(167,139,250,.15);color:#c4b5fd;margin-left:6px">👥 Командный (агенты под управлением продюсера)</span>'
      : '<span class="m-badge" style="background:rgba(148,163,184,.15);color:#94a3b8;margin-left:6px">🧑‍💻 Индивидуальный крон агента</span>'}

    <div class="m-block">
      <div class="m-label">Описание</div>
      <div class="m-text">${p.desc || '—'}</div>
    </div>

    <div class="m-grid">
      <div class="cell"><div class="m-label">🕐 Расписание</div><div class="m-text">${p.schedule}</div></div>
      <div class="cell"><div class="m-label">🎯 Цель</div><div class="m-text">${p.goal || '—'}</div></div>
      <div class="cell"><div class="m-label">👤 Ответственный</div><div class="m-text">${p.owner || '—'}</div></div>
      <div class="cell"><div class="m-label">🔗 Цепочка</div><div class="m-text">${p.chain}</div></div>
      <div class="cell"><div class="m-label">✅ Последний запуск</div><div class="m-text">${p.last}</div></div>
      <div class="cell"><div class="m-label">⏭ Следующий</div><div class="m-text">${p.next}</div></div>
    </div>

    ${p.notes ? `<div class="m-block"><div class="m-label">📌 Заметки / контекст</div><div class="m-notes m-text">${p.notes}</div></div>` : ''}
  `;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(e){
  if(e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
load();
</script>
</body>
</html>
